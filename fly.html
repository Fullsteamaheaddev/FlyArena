<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Drosophila melanogaster — body</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/webp" href="/favicon-512.webp" sizes="512x512" />
<link rel="apple-touch-icon" href="/favicon-512.webp" />
<link rel="stylesheet" href="/src/fly.css" />
</head>
<body>
<canvas id="c" aria-label="Interactive three-dimensional fruit fly. Drag to orbit and scroll or pinch to zoom." data-i18n-aria="fly.canvasAria"></canvas>
<div id="loading"><div class="title">Drosophila melanogaster</div><div id="status" data-i18n="fly.loading">loading Blender body…</div></div>
<header id="hud">
  <h1><i>Drosophila melanogaster</i></h1>
  <div class="sub" id="flySub"></div>
</header>
<details id="controls" open>
  <summary data-i18n="fly.display">Display</summary>
  <div class="controlOptions">
  <div class="seg" role="group" data-i18n-aria="fly.sexAria" aria-label="Sex"><button data-sex="m" class="on" data-i18n="fly.maleBtn">♂ male</button><button data-sex="f" data-i18n="fly.femaleBtn">♀ female</button></div>
  <div class="seg" role="group" data-i18n-aria="fly.wingsAria" aria-label="Wings"><button data-wings="rest" class="on" data-i18n="fly.wingsFolded">wings folded</button><button data-wings="spread" data-i18n="fly.wingsSpread">spread</button><button data-wings="flight" data-i18n="fly.wingsFlight">flying</button></div>
  <div class="seg" role="group" data-i18n-aria="fly.bgAria" aria-label="Backdrop"><button data-bg="light" class="on" data-i18n="fly.studio">studio</button><button data-bg="dark" data-i18n="fly.dark">dark field</button></div>
  <label><input type="checkbox" id="hairs" checked> <span data-i18n="fly.setae">setae</span></label>
  <label><input type="checkbox" id="dof" checked> <span data-i18n="fly.dof">macro depth of field</span></label>
  <label><input type="checkbox" id="labels"> <span data-i18n="fly.labels">anatomy on hover</span></label>
  </div>
</details>
<nav id="cameraViews" class="seg" data-i18n-aria="fly.camAria" aria-label="Camera position"><button id="fullBody" data-i18n="fly.fullBody">Full body</button><button id="headDetail" data-i18n="fly.headDetail">Head detail</button></nav>
<div id="tip" hidden><b></b><span></span></div>
<div id="hint" data-i18n="fly.hint">drag to orbit · scroll or pinch to zoom · double-click to focus</div>
<script type="module" src="/src/fly.js"></script>
</body>
</html>

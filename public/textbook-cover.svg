<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121628"/>
      <stop offset="1" stop-color="#0b0e18"/>
    </linearGradient>
    <linearGradient id="bump" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b64c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2c65e"/>
      <stop offset="1" stop-color="#e8b64c" stop-opacity="0"/>
    </linearGradient>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e8b64c"/>
    </marker>
    <marker id="rh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6890"/>
    </marker>
  </defs>

  <rect width="400" height="560" fill="url(#bg)"/>
  <rect x="14" y="14" width="372" height="532" fill="none" stroke="#c9a86a" stroke-width="1.4" opacity="0.7"/>
  <rect x="20" y="20" width="360" height="520" fill="none" stroke="#c9a86a" stroke-width="0.5" opacity="0.4"/>

  <!-- header -->
  <text x="200" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="7" fill="#c9a86a">THE FLY-BRAIN PROJECT</text>
  <line x1="140" y1="92" x2="260" y2="92" stroke="#c9a86a" stroke-width="0.7" opacity="0.6"/>

  <!-- title -->
  <text x="200" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#f5efe3" letter-spacing="2">COMPILING</text>
  <text x="200" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#f5efe3" letter-spacing="2">THE FLY</text>
  <text x="200" y="244" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#f5efe3" letter-spacing="2">BRAIN</text>
  <text x="200" y="284" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#c9a86a">from connectome to computation</text>

  <!-- ring attractor motif -->
  <g transform="translate(200,408)">
    <!-- outer surround-inhibition ring (Delta7), dashed -->
    <circle r="97" fill="none" stroke="#3a4560" stroke-width="1.2" stroke-dasharray="2 7" opacity="0.9"/>
    <!-- faint spokes -->
    <g stroke="#232c44" stroke-width="0.8">
      <line x1="0" y1="0" x2="0" y2="-78"/><line x1="0" y1="0" x2="55.2" y2="-55.2"/><line x1="0" y1="0" x2="78" y2="0"/><line x1="0" y1="0" x2="55.2" y2="55.2"/>
      <line x1="0" y1="0" x2="0" y2="78"/><line x1="0" y1="0" x2="-55.2" y2="55.2"/><line x1="0" y1="0" x2="-78" y2="0"/><line x1="0" y1="0" x2="-55.2" y2="-55.2"/>
    </g>
    <!-- column ring: 16 glomerulus dots -->
    <circle r="78" fill="none" stroke="#2a3350" stroke-width="1"/>
    <g fill="#4a5878">
      <circle cx="78" cy="0" r="3"/><circle cx="72.1" cy="29.9" r="3"/><circle cx="55.2" cy="55.2" r="3"/><circle cx="29.9" cy="72.1" r="3"/>
      <circle cx="0" cy="78" r="3"/><circle cx="-29.9" cy="72.1" r="3"/><circle cx="-55.2" cy="55.2" r="3"/><circle cx="-72.1" cy="29.9" r="3"/>
      <circle cx="-78" cy="0" r="3"/><circle cx="-72.1" cy="-29.9" r="3"/><circle cx="-55.2" cy="-55.2" r="3"/><circle cx="-29.9" cy="-72.1" r="3"/>
      <circle cx="0" cy="-78" r="3"/><circle cx="29.9" cy="-72.1" r="3"/><circle cx="55.2" cy="-55.2" r="3"/><circle cx="72.1" cy="-29.9" r="3"/>
    </g>
    <!-- the activity bump: glowing arc segment at top-right -->
    <path d="M 26.7 -73.3 A 78 78 0 0 1 76.6 -13.5" fill="none" stroke="#e8b64c" stroke-width="14" stroke-linecap="round" opacity="0.18"/>
    <path d="M 26.7 -73.3 A 78 78 0 0 1 76.6 -13.5" fill="none" stroke="url(#bump)" stroke-width="5" stroke-linecap="round"/>
    <!-- heading vector -->
    <line x1="0" y1="0" x2="56" y2="-42" stroke="#e8b64c" stroke-width="1.5" marker-end="url(#ah)"/>
    <!-- rotation arrow inside ring -->
    <path d="M -36 22 A 43 43 0 0 1 -14 -40" fill="none" stroke="#5a6890" stroke-width="1.4" marker-end="url(#rh)"/>
    <text x="0" y="30" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#8891ad">&#952;</text>
    <!-- compass ticks -->
    <g stroke="#5a6890" stroke-width="1">
      <line x1="0" y1="-104" x2="0" y2="-110"/><line x1="104" y1="0" x2="110" y2="0"/><line x1="0" y1="104" x2="0" y2="110"/><line x1="-104" y1="0" x2="-110" y2="0"/>
    </g>
  </g>

  <!-- footer -->
  <line x1="140" y1="498" x2="260" y2="498" stroke="#c9a86a" stroke-width="0.7" opacity="0.6"/>
  <text x="200" y="522" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="4" fill="#8891ad">A WORKING TEXTBOOK</text>
</svg>

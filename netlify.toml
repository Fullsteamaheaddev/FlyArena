[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/watch"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/watch/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/brain"
  to = "/brain.html"
  status = 200

[[redirects]]
  from = "/brain/"
  to = "/brain.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/racehost"
  to = "/arena.html"
  status = 200

[[redirects]]
  from = "/racehost/"
  to = "/arena.html"
  status = 200

# SharedArrayBuffer for the host sim (watchers do not need it).
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
